<!doctype html>
<html lang="id" data-theme="washi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WJY — Website minimalis untuk belajar menulis huruf Jepang Hiragana & Katakana dengan animasi urutan goresan, evaluasi otomatis, dan mode kuis hafalan."
    />
    <title>WJY — Belajar Menulis Hiragana & Katakana</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kana-sho-theme');
          if (saved === 'sumi' || saved === 'washi') {
            document.documentElement.setAttribute('data-theme', saved);
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            document.documentElement.setAttribute('data-theme', 'sumi');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
